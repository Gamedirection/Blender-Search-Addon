name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read the version number
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the addon zip
        if: steps.check.outputs.exists == 'false'
        run: python3 scripts/build_addon.py

      - name: Read this version's changelog section
        if: steps.check.outputs.exists == 'false'
        id: changelog
        run: |
          {
            echo 'text<<CHANGELOG_EOF'
            python3 scripts/changelog_section.py "${{ steps.version.outputs.value }}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Version ${{ steps.version.outputs.value }}" \
            --notes "${{ steps.changelog.outputs.text }}"
