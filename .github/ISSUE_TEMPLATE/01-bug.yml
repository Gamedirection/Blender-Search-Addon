name: Bug Report
description: Report something in the addon that is broken or crashes.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: blender-version
    attributes:
      label: Blender Version
      placeholder: "e.g. 5.2.0"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Addon Version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What Happened
      description: Describe the problem in detail.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What You Expected To Happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the exact steps that cause the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Message or Console Output
      render: shell
    validations:
      required: false
