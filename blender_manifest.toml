schema_version = "1.0.0"

id = "blender_search_addon"
version = "0.9.4"
name = "Blender Search"
tagline = "Search Blender's interface, inspect elements, and save your own links"
maintainer = "GameDirection <alex@gamedirection.net>"
type = "add-on"

website = "https://github.com/Gamedirection/Blender-Search-Addon"

tags = ["Interface"]

blender_version_min = "4.2.0"

license = [
  "SPDX:MIT",
]

[permissions]
network = "Opens your browser to the Blender manual and this addon's issue page, and downloads pictures, GIFs, and video thumbnails for registry items (can be turned off in preferences)"
files = "Saves your personal links, favorites, your own entries, and downloaded media in Blender's user configuration and cache folders, and reads/writes files you choose when exporting or importing your contributions"
